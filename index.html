<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>سامانه ممیزی سالیانه پتروشیمی‌های عسلویه</title>
<meta name="description" content="سامانه ثبت نمرات، رتبه‌بندی و گزارش ممیزی سالیانه شرکت‌های پتروشیمی عسلویه">
<meta name="theme-color" content="#0f2a3a">
<link rel="preload" href="fonts/Vazirmatn-Variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f2a3a'/%3E%3Cpath d='M18 34l10 10 20-22' fill='none' stroke='%2334d399' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">✓</div>
      <div>سامانه ممیزی پتروشیمی‌های عسلویه<small>شرکت بهداشت، ایمنی و محیط زیست</small></div>
    </div>
    <div class="top-sp"></div>
    <div class="yearbox"><label for="yearSel">سال ممیزی</label><select id="yearSel" aria-label="سال ممیزی"></select></div>
    <button class="iconbtn" id="newYearBtn" title="افزودن سال ممیزی جدید" aria-label="افزودن سال جدید">+ سال جدید</button>
    <div class="savestate" id="saveState" aria-live="polite"></div>
  </header>
  <nav class="side" id="side" aria-label="منوی اصلی"></nav>
  <main id="main"></main>
</div>
<div id="modalRoot"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div id="printRoot"></div>
<noscript><p style="padding:20px">برای استفاده از سامانه، جاوااسکریپت مرورگر باید فعال باشد.</p></noscript>
<script src="js/seed.js"></script>
<script src="js/core.js"></script>
<script src="js/views.js"></script>
</body>
</html>
